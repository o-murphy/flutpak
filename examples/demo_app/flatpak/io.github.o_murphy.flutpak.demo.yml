app-id: io.github.o_murphy.flutpak.demo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: demo_app
# Sandbox permissions — review and adjust for your app.
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: demo
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/demo/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/demo/.pub-cache
    # Build steps — review and customise for your project.
    build-commands:
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/engine.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/engine-dart-sdk.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/material_fonts.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/material_fonts.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/gradle_wrapper.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/gradle_wrapper.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/engine.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/engine_stamp.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/engine.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/flutter_sdk.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/engine.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/font-subset.stamp
      - cp $FLATPAK_BUILDER_BUILDDIR/flutter/bin/internal/engine.version $FLATPAK_BUILDER_BUILDDIR/flutter/bin/cache/linux-sdk.stamp
      - setup-flutter.sh
      - flutter build linux --release --no-pub
      - mkdir -p /app/demo
      - cp -r "$BUNDLE_PATH"/. /app/demo/
      - install -Dm755 flatpak/demo-wrapper.sh /app/bin/demo_app
      - install -Dm644 app/share/metainfo/io.github.o_murphy.flutpak.demo.metainfo.xml /app/share/metainfo/io.github.o_murphy.flutpak.demo.metainfo.xml
      - install -Dm644 app/share/applications/io.github.o_murphy.flutpak.demo.desktop /app/share/applications/io.github.o_murphy.flutpak.demo.desktop
      - install -Dm644 app/share/icons/hicolor/256x256/apps/io.github.o_murphy.flutpak.demo.png /app/share/icons/hicolor/256x256/apps/io.github.o_murphy.flutpak.demo.png
    sources:
      - type: git
        url: https://github.com/o-murphy/flutpak.git
