name: flutpak
description: >
  CLI tool that generates Flatpak manifests and offline source bundles for
  Flutter applications. One command prepares everything needed for a
  Flathub-compatible offline build: generated-sources.json, manifest with
  placeholders, patches, and Flutter SDK sources.
version: 0.2.3
repository: https://github.com/o-murphy/flutpak
topics:
  - flatpak
  - flathub
  - flutter
  - build-tool
  - linux

platforms:
  linux:

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  args: ^2.5.0
  crypto: ^3.0.0
  glob: ^2.1.2
  http: ^1.2.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

executables:
  flutpak: flutpak
