name: Demo

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/flutter
        with:
          flutter-version: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get
        working-directory: examples/demo_app

      - uses: ./.github/actions/generate
        with:
          config: examples/demo_app/flutpak.yaml
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          metainfo-path: examples/demo_app/app/share/metainfo/io.github.o_murphy.flutpak.demo.metainfo.xml
          artifact-path: examples/demo_app/flatpak/generated/
          artifact-name: flatpak-generated

  build:
    name: Build Flatpak (${{ matrix.variant.arch }})
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: flatpak-generated
          path: flatpak/generated

      - uses: ./.github/actions/build-flatpak
        with:
          manifest: flatpak/generated/io.github.o_murphy.flutpak.demo.yml
          app-id: io.github.o_murphy.flutpak.demo
          arch: ${{ matrix.variant.arch }}
          artifact-name: demo-flatpak-${{ matrix.variant.arch }}
          use-flathub-builder: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke test (x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-flatpak-x86_64

      - name: Install Flatpak and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install app from bundle
        run: flatpak install --user --noninteractive io.github.o_murphy.flutpak.demo_x86_64.flatpak

      - name: Smoke test — app starts
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum flatpak run io.github.o_murphy.flutpak.demo &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "✓ app is running"
            kill $PID
          else
            echo "✗ app exited unexpectedly"
            exit 1
          fi
