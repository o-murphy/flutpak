name: Flutter SDK Module Update

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      flutter-version:
        description: "Flutter version to generate (e.g. 3.44.2). Leave empty to auto-detect latest stable."
        required: false
        default: ""

concurrency:
  group: flutter-sdk-module-update
  cancel-in-progress: true

jobs:
  update:
    name: Check & generate Flutter SDK module
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Resolve Flutter version ──────────────────────────────────────────────
      - name: Resolve Flutter stable version
        id: flutter
        env:
          INPUT_VERSION: ${{ inputs.flutter-version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(curl -fsSL \
              "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
              | jq -r '
                  .releases[]
                  | select(.channel == "stable")
                  | .version
                ' \
              | head -1)
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Flutter version: $VERSION (source: ${INPUT_VERSION:+manual}${INPUT_VERSION:-auto})"

      # ── Check whether module already exists ──────────────────────────────────
      - name: Check if module already exists
        id: check
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          MODULE_FILE="modules/flutter-sdk/flutter-sdk-${VERSION}.json"
          if [ -f "$MODULE_FILE" ]; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "Module $MODULE_FILE already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Module $MODULE_FILE not found — will generate."
          fi
          echo "file=$MODULE_FILE" >> "$GITHUB_OUTPUT"

      # ── Build flutpak ────────────────────────────────────────────────────────
      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.exists == 'false'
        with:
          sdk: stable

      - name: Build flutpak
        if: steps.check.outputs.exists == 'false'
        run: |
          dart pub get
          FLUTPAK_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          dart compile exe bin/flutpak.dart -o "$RUNNER_TEMP/flutpak" \
            --define=version="$FLUTPAK_VERSION"
          sudo mv "$RUNNER_TEMP/flutpak" /usr/local/bin/flutpak
          sudo chmod +x /usr/local/bin/flutpak
          flutpak --version

      # ── Generate module ──────────────────────────────────────────────────────
      - name: Generate Flutter SDK module
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          flutpak sdk-mod --flutter "$VERSION" --output modules/flutter-sdk

      # ── Commit & open PR ─────────────────────────────────────────────────────
      - name: Create pull request
        if: steps.check.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: modules/flutter-sdk/
          branch: flutter-sdk-module/${{ steps.flutter.outputs.version }}
          delete-branch: true
          commit-message: "feat: add Flutter SDK module for ${{ steps.flutter.outputs.version }}"
          title: "feat: Flutter SDK module for ${{ steps.flutter.outputs.version }}"
          body: |
            Automated update: adds `modules/flutter-sdk/flutter-sdk-${{ steps.flutter.outputs.version }}.json`.

            Generated by the *Flutter SDK Module Update* workflow
            (trigger: `${{ steps.flutter.outputs.source }}`).

            To use in a flatpak manifest:
            ```yaml
            modules:
              - !include modules/flutter-sdk/flutter-sdk-${{ steps.flutter.outputs.version }}.json
            ```
          labels: automated,flutter-sdk
