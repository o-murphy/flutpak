name: Flutter SDK Module Update
run-name: "Flutter SDK Module Update — ${{ inputs.flutter-version || 'auto' }}"

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      flutter-version:
        description: "Flutter version to generate (e.g. 3.44.2). Leave empty to auto-detect latest stable."
        required: false
        default: ""
      force:
        description: "Force regeneration even if module already exists or PR is open."
        type: boolean
        required: false
        default: false

concurrency:
  group: flutter-sdk-module-update
  cancel-in-progress: true

jobs:
  update:
    name: Check & generate Flutter SDK module
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Resolve Flutter version ──────────────────────────────────────────────
      - name: Resolve Flutter stable version
        id: flutter
        env:
          INPUT_VERSION: ${{ inputs.flutter-version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(curl -fsSL \
              "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
              | jq -r '
                  .releases[]
                  | select(.channel == "stable")
                  | .version
                ' \
              | head -1)
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Flutter version: $VERSION (source: ${INPUT_VERSION:+manual}${INPUT_VERSION:-auto})"

      # ── Check whether module already exists or PR is open ───────────────────
      - name: Check if module already exists or PR is open
        id: check
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="flutter-sdk-module/${VERSION}"
          MODULE_FILE="modules/flutter-sdk/flutter-sdk-${VERSION}.json"
          echo "file=$MODULE_FILE" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" != "true" ]; then
            if [ -f "$MODULE_FILE" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Module $MODULE_FILE already exists in main — nothing to do."
              exit 0
            fi

            OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$OPEN_PR" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "PR #${OPEN_PR} already open for $BRANCH — nothing to do."
              exit 0
            fi
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Module not found and no open PR — will generate."

      # ── Build flutpak ────────────────────────────────────────────────────────
      - uses: ./.github/actions/setup-flutpak
        if: steps.check.outputs.exists == 'false'

      # ── Generate module ──────────────────────────────────────────────────────
      - name: Generate Flutter SDK module
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          flutpak sdk-mod --flutter "$VERSION" --output modules/flutter-sdk

      # ── Commit & open PR ─────────────────────────────────────────────────────
      - name: Commit and open PR
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
          SOURCE: ${{ steps.flutter.outputs.source }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="flutter-sdk-module/${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add modules/flutter-sdk/
          git commit -m "feat: add Flutter SDK module for ${VERSION}"
          FORCE_FLAG=""
          [ "${{ inputs.force }}" = "true" ] && FORCE_FLAG="--force"
          git push $FORCE_FLAG origin "$BRANCH"

          gh label create "automated"   --color "#0075ca" --force || true
          gh label create "flutter-sdk" --color "#7057ff" --force || true

          gh pr create \
            --title "feat: Flutter SDK module for ${VERSION}" \
            --body "$(cat <<EOF
          Automated update: adds \`modules/flutter-sdk/flutter-sdk-${VERSION}.json\`.

          Generated by the *Flutter SDK Module Update* workflow (trigger: \`${SOURCE}\`).

          To use in a flatpak manifest:
          \`\`\`yaml
          modules:
            - !include modules/flutter-sdk/flutter-sdk-${VERSION}.json
          \`\`\`
          EOF
          )" \
            --label "automated" \
            --label "flutter-sdk" \
            --base main \
            --head "$BRANCH"
