name: Flutter SDK Module Update
run-name: "Flutter SDK Module Update — ${{ inputs.flutter-version || 'auto' }}"

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      flutter-version:
        description: "Flutter version to generate (e.g. 3.44.2). Leave empty to auto-detect latest stable."
        required: false
        default: ""
      force:
        description: "Force regeneration even if module already exists or PR is open."
        type: boolean
        required: false
        default: false

concurrency:
  group: flutter-sdk-module-update
  cancel-in-progress: true

jobs:
  update:
    name: Check & generate Flutter SDK module
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Resolve Flutter version ──────────────────────────────────────────────
      - name: Resolve Flutter stable version
        id: flutter
        env:
          INPUT_VERSION: ${{ inputs.flutter-version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(curl -fsSL \
              "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
              | jq -r '
                  .releases[]
                  | select(.channel == "stable")
                  | .version
                ' \
              | head -1)
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Flutter version: $VERSION (source: ${INPUT_VERSION:+manual}${INPUT_VERSION:-auto})"

      # ── Check whether module already exists or PR is open ───────────────────
      - name: Check if module already exists or PR is open
        id: check
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="flutter-sdk-module/${VERSION}"
          MODULE_FILE="modules/flutter-sdk/flutter-sdk-${VERSION}.json"
          echo "file=$MODULE_FILE"   >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"      >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" != "true" ] && [ -f "$MODULE_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Module $MODULE_FILE already exists in main — nothing to do."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)
          echo "open_pr=${OPEN_PR}" >> "$GITHUB_OUTPUT"
          if [ -n "$OPEN_PR" ]; then
            echo "PR #${OPEN_PR} already open — will update it."
          else
            echo "No open PR — will create one."
          fi

      # ── Build flutpak ────────────────────────────────────────────────────────
      - uses: ./.github/actions/setup-flutpak
        if: steps.check.outputs.skip == 'false'

      # ── Generate module ──────────────────────────────────────────────────────
      - name: Generate Flutter SDK module
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          flutpak sdk-mod --flutter "$VERSION" --output modules/flutter-sdk

      # ── Commit & update/open PR ───────────────────────────────────────────────
      - name: Commit and update/open PR
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION:  ${{ steps.flutter.outputs.version }}
          SOURCE:   ${{ steps.flutter.outputs.source }}
          BRANCH:   ${{ steps.check.outputs.branch }}
          OPEN_PR:  ${{ steps.check.outputs.open_pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add modules/flutter-sdk/
          git commit -m "feat: add Flutter SDK module for ${VERSION}"
          FORCE_FLAG=""
          [ "${{ inputs.force }}" = "true" ] || [ -n "$OPEN_PR" ] && FORCE_FLAG="--force"
          git push $FORCE_FLAG origin "$BRANCH"

          gh label create "automated"   --color "#0075ca" --force || true
          gh label create "flutter-sdk" --color "#7057ff" --force || true

          BODY_FILE=$(mktemp)
          printf 'Automated update: adds `modules/flutter-sdk/flutter-sdk-%s.json`.\n\nGenerated by the *Flutter SDK Module Update* workflow (trigger: `%s`).\n\nTo use in a flatpak manifest:\n```yaml\nmodules:\n  - modules/flutter-sdk/flutter-sdk-%s.json\n```\n' \
            "$VERSION" "$SOURCE" "$VERSION" > "$BODY_FILE"

          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" \
              --title "feat: Flutter SDK module for ${VERSION}" \
              --body-file "$BODY_FILE"
            echo "Updated existing PR #${OPEN_PR}"
          else
            gh pr create \
              --title "feat: Flutter SDK module for ${VERSION}" \
              --body-file "$BODY_FILE" \
              --label "automated" \
              --label "flutter-sdk" \
              --base main \
              --head "$BRANCH"
          fi
