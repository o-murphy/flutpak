name: Test setup

on:
    push:
        branches:
            - "*"
    pull_request:

jobs:
    # ── Lint + unit tests ────────────────────────────────────────────────────────
    test:
        name: Smoke test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install flutpak
              uses: ./.github/actions/setup-flutpak
              # No version input — action builds from $GITHUB_ACTION_PATH,
              # which is this checkout, so it always reflects the branch under review.
