name: Test build-flatpak-official action

on:
  workflow_dispatch:
    inputs:
      manifest-path:
        description: "Path to the Flatpak manifest"
        required: true
        type: string
      app-id:
        description: "Flatpak application ID (e.g. io.github.example.App)"
        required: true
        type: string
      upload-artifact:
        description: "Upload the bundle as a GitHub artifact"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-x86_64:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-flatpak-official
        with:
          manifest-path: ${{ inputs.manifest-path }}
          bundle: ${{ inputs.app-id }}_x86_64.flatpak
          arch: x86_64
          cache-key: flatpak-builder-x86_64-${{ github.sha }}
          upload-artifact: ${{ inputs.upload-artifact }}

  build-aarch64:
    name: Build Flatpak (aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-flatpak-official
        with:
          manifest-path: ${{ inputs.manifest-path }}
          bundle: ${{ inputs.app-id }}_aarch64.flatpak
          arch: aarch64
          cache-key: flatpak-builder-aarch64-${{ github.sha }}
          upload-artifact: ${{ inputs.upload-artifact }}
