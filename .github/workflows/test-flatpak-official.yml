name: Test build-flatpak-official action

# Manual trigger only — used to evaluate the official flatpak-github-actions
# as an alternative to the custom build-flatpak action.
on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Upload the built .flatpak bundle as a GitHub artifact"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # ── Step 1: generate the final manifest from the example app ─────────────────
  generate:
    name: Generate Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: stable
          cache: true

      - name: Install flutpak (from this checkout)
        uses: ./.github/actions/setup-flutpak

      - name: Generate manifest
        run: |
          flutpak generate \
            --config example/flutpak.yaml \
            --commit "${{ github.sha }}" \
            --sdk "$FLUTTER_ROOT"

      - name: Upload generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-generated
          path: example/flatpak/generated/
          retention-days: 1
          if-no-files-found: error

  # ── Step 2a: build x86_64 ────────────────────────────────────────────────────
  build-x86_64:
    name: Build Flatpak (x86_64)
    needs: generate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download generated manifest
        uses: actions/download-artifact@v4
        with:
          name: flatpak-generated
          path: example/flatpak/generated/

      - uses: ./.github/actions/build-flatpak-official
        with:
          manifest-path: example/flatpak/generated/io.github.flutpak.Example.yml
          bundle: io.github.flutpak.Example_x86_64.flatpak
          arch: x86_64
          cache-key: flatpak-builder-x86_64-${{ github.sha }}
          upload-artifact: ${{ inputs.upload-artifact }}

  # ── Step 2b: build aarch64 ───────────────────────────────────────────────────
  build-aarch64:
    name: Build Flatpak (aarch64)
    needs: generate
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download generated manifest
        uses: actions/download-artifact@v4
        with:
          name: flatpak-generated
          path: example/flatpak/generated/

      - uses: ./.github/actions/build-flatpak-official
        with:
          manifest-path: example/flatpak/generated/io.github.flutpak.Example.yml
          bundle: io.github.flutpak.Example_aarch64.flatpak
          arch: aarch64
          cache-key: flatpak-builder-aarch64-${{ github.sha }}
          upload-artifact: ${{ inputs.upload-artifact }}
