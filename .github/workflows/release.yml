name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test --exclude-tags "integration,flutter" --reporter=expanded

  prepare:
    name: Prepare release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version bump commit
      id-token: write # pub.dev OIDC trusted publisher
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Extract version and detect pre-release
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version in pubspec.yaml
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.meta.outputs.version }}"
          git push origin main

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "No changelog entry found for $VERSION — add it to CHANGELOG.md first"
            exit 1
          fi
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: /tmp/release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Publish to pub.dev
        run: dart pub publish --force

  build-binaries:
    name: Build binary (${{ matrix.arch }})
    needs: [test, prepare]
    strategy:
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
            artifact: flutpak-linux-x64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            artifact: flutpak-linux-arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Build binary
        run: |
          dart compile exe bin/flutpak.dart -o ${{ matrix.artifact }} \
            --define=version=${{ needs.prepare.outputs.tag }}

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ matrix.artifact }}
