name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: GitHub Release & pub.dev
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create GitHub release
      id-token: write   # pub.dev OIDC trusted publisher

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test --exclude-tags "integration,flutter" --reporter=expanded

      - name: Determine pre-release
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" \
            CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "No changelog entry found for $VERSION" && exit 1
          fi
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Publish to pub.dev
        run: dart pub publish --force
