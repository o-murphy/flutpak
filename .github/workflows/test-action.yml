name: Test prepare action

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/actions/prepare/**
      - .github/actions/verify/**
      - .github/workflows/test-action.yml
      - bin/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
  pull_request:
    paths:
      - .github/actions/prepare/**
      - .github/actions/verify/**
      - .github/workflows/test-action.yml
      - bin/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

jobs:
  # ── Input validation (fast, no Flutter needed) ───────────────────────────────
  test-input-validation:
    name: Fails without flutter version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run action without flutter version (expect failure)
        id: no-flutter
        continue-on-error: true
        uses: ./.github/actions/prepare
        with:
          tag_name: v0.0.0
          commit: ${{ github.sha }}
          validate: 'false'

      - name: Assert failure
        run: |
          [ "${{ steps.no-flutter.outcome }}" = "failure" ] || \
            { echo "ERROR: expected failure, got ${{ steps.no-flutter.outcome }}"; exit 1; }
          echo "✓ correctly fails without flutter version"

  # ── Smoke: explicit flutter_version ────────────────────────────────────
  test-smoke-flutter-version:
    name: Smoke — flutter_version input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write minimal config
        run: |
          mkdir -p flatpak
          cat > flutpak.yaml <<'EOF'
          output: flatpak
          pub:
            locks: []
          EOF

      - name: Run prepare
        uses: ./.github/actions/prepare
        with:
          tag_name: v0.0.0-smoke
          commit: ${{ github.sha }}
          flutter_version: stable
          config: flutpak.yaml
          validate: 'false'

      - name: Verify output
        run: |
          [ -f flatpak/generated-sources.json ] || \
            { echo "ERROR: generated-sources.json not written"; exit 1; }
          echo "✓ generated-sources.json written"
          wc -c flatpak/generated-sources.json

  # ── Smoke: flutter_version_file input ────────────────────────────
  test-smoke-version-file:
    name: Smoke — flutter_version_file input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write version file and config
        run: |
          mkdir -p flatpak
          echo "stable" > flatpak/flutter.version
          cat > flutpak.yaml <<'EOF'
          output: flatpak
          pub:
            locks: []
          EOF

      - name: Run prepare
        uses: ./.github/actions/prepare
        with:
          tag_name: v0.0.0-smoke
          commit: ${{ github.sha }}
          flutter_version_file: flatpak/flutter.version
          config: flutpak.yaml
          validate: 'false'

      - name: Verify output
        run: |
          [ -f flatpak/generated-sources.json ] || \
            { echo "ERROR: generated-sources.json not written"; exit 1; }
          echo "✓ flutter_version_file input works"

  # ── Smoke: specific flutpak_ref ────────────────────────────────────
  test-specific-flutpak-ref:
    name: Smoke — specific flutpak_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write config
        run: |
          mkdir -p flatpak
          cat > flutpak.yaml <<'EOF'
          output: flatpak
          pub:
            locks: []
          EOF

      - name: Run prepare with current branch ref
        uses: ./.github/actions/prepare
        with:
          tag_name: v0.0.0-test
          commit: ${{ github.sha }}
          flutter_version: stable
          flutpak_ref: ${{ github.head_ref || github.ref_name }}
          config: flutpak.yaml
          validate: 'false'

      - name: Verify output
        run: |
          [ -f flatpak/generated-sources.json ] || \
            { echo "ERROR: generated-sources.json not written"; exit 1; }
          echo "✓ works with specific flutpak_ref"

  # ── Verify action: passes on matching pin ───────────────────────────
  test-verify-pass:
    name: Verify — passes on correct pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write manifest with correct pin
        run: |
          mkdir -p flatpak
          cat > flatpak/test.yml <<'EOF'
          app-id: com.example.Test
          modules:
            - name: Test
              sources:
                - type: git
                  tag: v1.2.3
                  commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EOF

      - uses: ./.github/actions/verify
        with:
          tag_name: v1.2.3
          commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          manifest: flatpak/test.yml
          flutpak_ref: ${{ github.head_ref || github.ref_name }}

  # ── Verify action: fails on mismatched pin ──────────────────────────
  test-verify-fail:
    name: Verify — fails on wrong pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write manifest with wrong pin
        run: |
          mkdir -p flatpak
          cat > flatpak/test.yml <<'EOF'
          app-id: com.example.Test
          modules:
            - name: Test
              sources:
                - type: git
                  tag: v1.2.2
                  commit: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          EOF

      - name: Run verify (expect failure)
        id: wrong-pin
        continue-on-error: true
        uses: ./.github/actions/verify
        with:
          tag_name: v1.2.3
          commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          manifest: flatpak/test.yml
          flutpak_ref: ${{ github.head_ref || github.ref_name }}

      - name: Assert failure
        run: |
          [ "${{ steps.wrong-pin.outcome }}" = "failure" ] || \
            { echo "ERROR: expected failure, got ${{ steps.wrong-pin.outcome }}"; exit 1; }
          echo "✓ correctly fails on mismatched pin"
