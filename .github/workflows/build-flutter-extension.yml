name: Build Flutter SDK Extension

on:
  push:
    branches: [main]
    paths:
      - flutter_extension/**
  pull_request:
    paths:
      - flutter_extension/**
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version tag"
        required: false
        default: "3.44.0"

jobs:
  generate:
    name: Generate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/flutter
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.0' }}
          cache: true

      - uses: ./.github/actions/setup-flutpak

      - name: Generate extension manifest
        run: |
          flutpak sdk-ext \
            --sdk "$FLUTTER_ROOT" \
            --app-id io.github.o_murphy.flutter \
            --runtime-version 25.08 \
            --output flutter_extension/io.github.o_murphy.flutter.json

      - uses: actions/upload-artifact@v7
        with:
          name: flutter-extension-manifest
          path: flutter_extension/io.github.o_murphy.flutter.json

  build:
    name: Build extension
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: flutter-extension-manifest
          path: flutter_extension/

      - uses: ./.github/actions/build-flatpak
        with:
          manifest: flutter_extension/io.github.o_murphy.flutter.json
          app-id: io.github.o_murphy.flutter
          runtime: true
          artifact-name: flutter-extension-bundle
