name: Build Flutter SDK Extension

on:
  push:
    branches: [main]
    paths:
      - flutter_extension/**
  pull_request:
    paths:
      - flutter_extension/**
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version tag"
        required: false
        default: "3.44.0"

jobs:
  generate:
    name: Generate & validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: ./.github/actions/flutter
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.44.0' }}
          cache: true

      - name: Set up flutpak
        uses: ./.github/actions/setup-flutpak

      - name: Generate extension manifest
        run: |
          flutpak sdk-ext \
            --sdk "$FLUTTER_ROOT" \
            --runtime-version 25.08 \
            --output flutter_extension/org.freedesktop.Sdk.Extension.flutter3.json

      - name: Validate manifest
        run: |
          python3 - <<'EOF'
          import json
          with open('flutter_extension/org.freedesktop.Sdk.Extension.flutter3.json') as f:
              m = json.load(f)
          assert m.get('build-extension') is True
          assert m.get('id', '').startswith('org.freedesktop.Sdk.Extension.flutter')
          assert m.get('runtime') == 'org.freedesktop.Sdk'
          sources = m['modules'][0]['sources']
          types = [s.get('type') for s in sources]
          assert 'git' in types
          assert 'archive' in types
          assert 'patch' in types
          print(f"OK  id={m['id']}  runtime-version={m['runtime-version']}  sources={len(sources)}")
          EOF

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-extension-manifest
          path: flutter_extension/org.freedesktop.Sdk.Extension.flutter3.json

  build:
    name: Build extension with flatpak-builder
    runs-on: ubuntu-latest
    needs: generate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download generated manifest
        uses: actions/download-artifact@v4
        with:
          name: flutter-extension-manifest
          path: flutter_extension/

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Freedesktop SDK runtime
        run: |
          RUNTIME_VERSION=$(python3 -c "
          import json
          with open('flutter_extension/org.freedesktop.Sdk.Extension.flutter3.json') as f:
              print(json.load(f)['runtime-version'])
          ")
          flatpak install --user -y flathub \
            org.freedesktop.Sdk//$RUNTIME_VERSION \
            org.freedesktop.Platform//$RUNTIME_VERSION

      - name: Build extension
        run: |
          flatpak-builder \
            --user --install --force-clean \
            --state-dir=.flatpak-builder \
            build-dir \
            flutter_extension/org.freedesktop.Sdk.Extension.flutter3.json

      - name: Smoke test — flutter --version
        run: |
          flatpak run \
            --command=/usr/lib/sdk/flutter/bin/flutter \
            --filesystem=host \
            org.freedesktop.Platform \
            -- --version
