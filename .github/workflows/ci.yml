name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Lint + unit tests ────────────────────────────────────────────────────────
  test:
    name: Analyze & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Unit tests
        run: dart test --exclude-tags "integration,flutter" --reporter=expanded

      - name: Golden tests
        run: dart test test/golden_test.dart --reporter=expanded

  # ── Integration tests (real pub.dev network) ─────────────────────────────────
  integration:
    name: Integration tests (pub.dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Integration tests
        run: dart test --tags integration --reporter=expanded

  # ── Flutter SDK tests (real Flutter clone) ───────────────────────────────────
  flutter:
    name: Flutter SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Flutter SDK tests
        run: dart test --tags flutter --reporter=expanded

  # ── Compile + smoke tests ────────────────────────────────────────────────────
  compile:
    name: Compile & Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Compile
        run: dart compile exe bin/flutpak.dart -o /tmp/flutpak

      - name: Smoke test — version
        run: /tmp/flutpak --version

      - name: Smoke test — help
        run: /tmp/flutpak --help

      - name: Smoke test — pub --help
        run: /tmp/flutpak pub --help

      - name: Smoke test — sdk-mod --help
        run: /tmp/flutpak sdk-mod --help

      - name: Smoke test — init --help
        run: /tmp/flutpak init --help

      - name: Smoke test — generate --help
        run: /tmp/flutpak generate --help

      - name: Smoke test — pub sources (real pub.dev)
        run: |
          mkdir -p /tmp/smoke-sources
          /tmp/flutpak pub \
            --lock test/fixtures/simple.lock \
            --output /tmp/smoke-sources
          COUNT=$(python3 -c "import json; d=json.load(open('/tmp/smoke-sources/generated-sources.json')); print(len(d))")
          [ "$COUNT" -eq 6 ] || { echo "Expected 6 entries (3 archive + 3 inline), got $COUNT"; exit 1; }
          echo "pub smoke test passed: $COUNT entries"
