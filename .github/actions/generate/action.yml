name: Flutpak generate
description: >
  Runs flutpak generate, optionally validates metainfo,
  and uploads the generated manifest + sources as an artifact.
  If metainfo-path is set, appstream is installed automatically.

inputs:
  tag:
    description: "Git tag to pin in the manifest (mutually exclusive with commit)"
    required: false
    default: ""
  commit:
    description: "Commit SHA to pin in the manifest (defaults to github.sha)"
    required: false
    default: ""
  sdk:
    description: >
      Path to Flutter SDK root. Auto-detected from FLUTTER_ROOT env var
      or 'flutter' in PATH if not set.
    required: false
    default: ""
  metainfo-path:
    description: "Path to .metainfo.xml for appstreamcli validation. Skip if empty."
    required: false
    default: ""
  artifact-name:
    description: "Name for the uploaded submission artifact"
    required: false
    default: "flutpak-artifacts"
  retention-days:
    description: "Artifact retention in days"
    required: false
    default: "2"
  flutpak-version:
    description: >
      flutpak version to install (tag, branch, or commit SHA).
      If empty, uses the ref from the 'uses:' directive — same behaviour
      as setup-flutpak's version input.
    required: false
    default: ""
  config:
    description: "Path to flutpak config file. Passed as --config to init and generate."
    required: false
    default: ""
  init:
    description: "Run 'flutpak init --force' before generate."
    required: false
    default: "false"
  artifact-path:
    description: "Path uploaded as the submission artifact."
    required: false
    default: "flatpak/generated/"

runs:
  using: composite
  steps:
    - name: Set up Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Build and install flutpak
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.flutpak-version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          git clone https://github.com/o-murphy/flutpak.git "$RUNNER_TEMP/flutpak-src"
          git -C "$RUNNER_TEMP/flutpak-src" fetch --tags
          git -C "$RUNNER_TEMP/flutpak-src" checkout "$INPUT_VERSION"
          SRC_DIR="$RUNNER_TEMP/flutpak-src"
        else
          # Build from the same ref this action was checked out at.
          # GITHUB_ACTION_PATH points to .github/actions/generate/ inside
          # the flutpak repo; three levels up is the repo root.
          SRC_DIR="$GITHUB_ACTION_PATH/../../.."
        fi
        cd "$SRC_DIR"
        dart pub get
        FLUTPAK_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        dart compile exe bin/flutpak.dart -o "$RUNNER_TEMP/flutpak" \
          --define=version="$FLUTPAK_VERSION"
        sudo mv "$RUNNER_TEMP/flutpak" /usr/local/bin/flutpak
        sudo chmod +x /usr/local/bin/flutpak

    - name: Verify flutpak installation
      shell: bash
      run: flutpak --version

    - name: Fetch tag
      if: inputs.tag != ''
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        git fetch origin "refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}" --depth=1 \
          || git fetch --tags --depth=1

    - name: Resolve SDK path
      id: sdk
      shell: bash
      env:
        INPUT_SDK: ${{ inputs.sdk }}
      run: |
        SDK="$INPUT_SDK"
        if [ -z "$SDK" ]; then
          if [ -n "${FLUTTER_ROOT:-}" ]; then
            SDK="$FLUTTER_ROOT"
          elif command -v flutter &>/dev/null; then
            SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          else
            echo "ERROR: Flutter SDK not found. Set FLUTTER_ROOT, add flutter to PATH, or pass sdk input." >&2
            exit 1
          fi
        fi
        echo "path=$SDK" >> "$GITHUB_OUTPUT"

    - name: Set ref flag
      id: ref
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMMIT: ${{ inputs.commit }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        if [ -n "$INPUT_TAG" ]; then
          echo "flag=--tag"    >> "$GITHUB_OUTPUT"
          echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
        else
          echo "flag=--commit" >> "$GITHUB_OUTPUT"
          echo "value=${INPUT_COMMIT:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        fi

    - name: Flutpak init
      if: inputs.init == 'true'
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        SDK_PATH: ${{ steps.sdk.outputs.path }}
      run: |
        CONFIG_FLAG=""
        [ -n "$INPUT_CONFIG" ] && CONFIG_FLAG="--config $INPUT_CONFIG"
        flutpak init --force $CONFIG_FLAG --sdk "$SDK_PATH"

    - name: Flutpak generate
      shell: bash
      env:
        REF_FLAG: ${{ steps.ref.outputs.flag }}
        REF_VALUE: ${{ steps.ref.outputs.value }}
        SDK_PATH: ${{ steps.sdk.outputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        CONFIG_FLAG=""
        [ -n "$INPUT_CONFIG" ] && CONFIG_FLAG="--config $INPUT_CONFIG"
        flutpak generate "$REF_FLAG" "$REF_VALUE" --sdk "$SDK_PATH" $CONFIG_FLAG

    - name: Install appstream
      if: inputs.metainfo-path != ''
      shell: bash
      run: |
        if ! command -v appstreamcli &>/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y appstream
        fi

    - name: Validate metainfo
      if: inputs.metainfo-path != ''
      shell: bash
      env:
        INPUT_METAINFO_PATH: ${{ inputs.metainfo-path }}
      run: appstreamcli validate --explain --no-net "$INPUT_METAINFO_PATH"

    - name: Upload submission artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        retention-days: ${{ inputs.retention-days }}
