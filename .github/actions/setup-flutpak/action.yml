name: Setup flutpak
description: >
  Installs flutpak binary globally as a standalone tool.
  After this action, you can use 'flutpak' command directly
  in subsequent steps.

inputs:
  version:
    description: >
      Tag, commit SHA, or branch name to build from.
      If empty, builds from the same ref the action was checked out at
      (i.e. the ref specified in the 'uses:' directive).
    required: false
    default: ""
  install_dir:
    description: Directory to install flutpak binary
    required: false
    default: "/usr/local/bin"

runs:
  using: composite
  steps:
    - name: Set up Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Build and install flutpak
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          # No explicit version — build from the action's own checkout.
          # $GITHUB_ACTION_PATH is the directory where this action lives,
          # already at the ref given in the 'uses:' directive.
          SRC_DIR="$GITHUB_ACTION_PATH/../../.."
        else
          git clone https://github.com/o-murphy/flutpak.git "$RUNNER_TEMP/flutpak-src"
          git -C "$RUNNER_TEMP/flutpak-src" fetch --tags
          git -C "$RUNNER_TEMP/flutpak-src" checkout "$VERSION"
          SRC_DIR="$RUNNER_TEMP/flutpak-src"
        fi

        cd "$SRC_DIR"
        dart pub get
        FLUTPAK_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        dart compile exe bin/flutpak.dart -o "$RUNNER_TEMP/flutpak" \
          --define=version="$FLUTPAK_VERSION"

        sudo mkdir -p "${{ inputs.install_dir }}"
        sudo mv "$RUNNER_TEMP/flutpak" "${{ inputs.install_dir }}/flutpak"
        sudo chmod +x "${{ inputs.install_dir }}/flutpak"

    - name: Verify installation
      shell: bash
      run: flutpak --version
