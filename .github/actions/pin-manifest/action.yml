name: Pin Flatpak Manifest
description: >
  Generates Flatpak sources and pins manifest placeholders to a tag/commit.
  Uses a pre-compiled flutpak binary from GitHub releases — no Dart SDK required.

inputs:
  tag_name:
    description: Tag to pin (e.g. v0.1.15)
    required: true
  commit:
    description: Commit SHA (empty = resolved from tag automatically)
    required: false
    default: ''
  config:
    description: >
      Path to flutpak config file — either flutpak.yaml or a pubspec.yaml
      containing a flutpak: section. If omitted, flutpak searches the current
      working directory automatically.
    required: false
    default: ''
  flutter_version:
    description: >
      Flutter SDK version to install (e.g. 3.41.9). Takes priority over
      flutter_version_file. One of flutter_version or flutter_version_file
      must be provided.
    required: false
    default: ''
  flutter_version_file:
    description: >
      Path to a committed file containing the Flutter version string
      (e.g. flatpak/flutter.version). Used when flutter_version is not set.
      One of flutter_version or flutter_version_file must be provided.
    required: false
    default: ''
  flutpak_version:
    description: flutpak release tag to download (empty = latest stable)
    required: false
    default: ''
  flutpak_binary:
    description: >
      Path to a pre-built flutpak binary. When set, skips the download steps.
      Intended for CI testing of the action itself.
    required: false
    default: ''
  cache:
    description: Enable caching for Flutter SDK
    required: false
    default: 'true'
  validate:
    description: >
      Run flutpak validate after prepare to check the AppStream metainfo file.
      Installs appstream-util automatically. Set to false to skip.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve flutpak version
      id: flutpak-ver
      if: inputs.flutpak_binary == ''
      shell: bash
      run: |
        VERSION="${{ inputs.flutpak_version }}"
        if [ -z "$VERSION" ]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/o-murphy/flutpak/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download flutpak binary
      if: inputs.flutpak_binary == ''
      shell: bash
      run: |
        case "${{ runner.arch }}" in
          ARM64) ARCH=arm64 ;;
          *)     ARCH=x64   ;;
        esac
        curl -fsSL \
          "https://github.com/o-murphy/flutpak/releases/download/${{ steps.flutpak-ver.outputs.version }}/flutpak-linux-${ARCH}" \
          -o "$RUNNER_TEMP/flutpak"
        chmod +x "$RUNNER_TEMP/flutpak"

    - name: Resolve commit SHA
      id: meta
      shell: bash
      run: |
        COMMIT="${{ inputs.commit }}"
        if [ -z "$COMMIT" ]; then
          COMMIT=$(git rev-parse "${{ inputs.tag_name }}" 2>/dev/null || \
            { git fetch origin tag "${{ inputs.tag_name }}" --no-tags >/dev/null 2>&1 && \
              git rev-parse "${{ inputs.tag_name }}"; })
        fi
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT

    - name: Resolve Flutter version
      id: flutter-ver
      shell: bash
      run: |
        VERSION="${{ inputs.flutter_version }}"
        if [ -z "$VERSION" ] && [ -n "${{ inputs.flutter_version_file }}" ]; then
          VERSION=$(cat "${{ inputs.flutter_version_file }}")
        fi
        if [ -z "$VERSION" ]; then
          echo "::error::Either flutter_version or flutter_version_file must be provided"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: o-murphy/flutpak/.github/actions/flutter@main
      with:
        flutter-version: ${{ steps.flutter-ver.outputs.version }}
        cache: ${{ inputs.cache }}

    - name: Resolve flutter_tools pubspec.lock
      shell: bash
      run: |
        LOCK="$FLUTTER_ROOT/packages/flutter_tools/pubspec.lock"
        if [ ! -f "$LOCK" ]; then
          (cd "$FLUTTER_ROOT/packages/flutter_tools" && dart pub get --no-example)
        fi

    - name: Run flutpak prepare
      shell: bash
      run: |
        FLUTPAK="${{ inputs.flutpak_binary || format('{0}/flutpak', runner.temp) }}"
        CONFIG="${{ inputs.config }}"
        "$FLUTPAK" prepare \
          ${CONFIG:+--config "$CONFIG"} \
          --tag "${{ inputs.tag_name }}" \
          --commit "${{ steps.meta.outputs.commit }}" \
          --sdk "$FLUTTER_ROOT"

    - name: Install appstream-util
      if: inputs.validate == 'true'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends appstream

    - name: Validate metainfo
      if: inputs.validate == 'true'
      shell: bash
      run: |
        FLUTPAK="${{ inputs.flutpak_binary || format('{0}/flutpak', runner.temp) }}"
        CONFIG="${{ inputs.config }}"
        "$FLUTPAK" validate \
          ${CONFIG:+--config "$CONFIG"}
