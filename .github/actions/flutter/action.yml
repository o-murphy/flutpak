name: "Setup Flutter"
description: "Install Flutter SDK with caching (Linux, no precache)"

inputs:
  flutter-version:
    description: 'Flutter SDK version (e.g., "3.41.6", "stable", "beta")'
    required: false
    default: "stable"
  flutter-version-file:
    description: 'Path to a file containing the Flutter version (e.g. .flutter-version). Takes precedence over flutter-version.'
    required: false
    default: ""
  cache:
    description: "Enable caching for Flutter SDK"
    required: false
    default: "true"

outputs:
  flutter-path:
    description: "Path to the installed Flutter SDK"
    value: ${{ steps.get-path.outputs.flutter-path }}

runs:
  using: "composite"
  steps:
    - name: Get Flutter path
      id: get-path
      shell: bash
      run: echo "flutter-path=$RUNNER_TEMP/flutter" >> $GITHUB_OUTPUT

    - name: Resolve effective version
      id: effective
      shell: bash
      run: |
        FILE="${{ inputs.flutter-version-file }}"
        if [ -n "$FILE" ] && [ -f "$FILE" ]; then
          VERSION=$(tr -d '[:space:]' < "$FILE")
        else
          VERSION="${{ steps.effective.outputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Resolve version and clone depth
      id: resolve-version
      shell: bash
      run: |
        VERSION="${{ steps.effective.outputs.version }}"
        case "$VERSION" in
          stable|beta|latest)
            echo "branch=${VERSION/latest/stable}" >> $GITHUB_OUTPUT
            echo "depth=1" >> $GITHUB_OUTPUT
            ;;
          main|master)
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "depth=50" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "branch=$VERSION" >> $GITHUB_OUTPUT
            echo "depth=1" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Cache Flutter SDK
      if: inputs.cache == 'true'
      id: cache-flutter
      uses: actions/cache@v5
      with:
        path: ${{ steps.get-path.outputs.flutter-path }}
        key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-version.outputs.branch }}
        restore-keys: |
          flutter-${{ runner.os }}-${{ runner.arch }}-

    - name: Clone or repair Flutter SDK
      shell: bash
      run: |
        FLUTTER_PATH="${{ steps.get-path.outputs.flutter-path }}"
        BRANCH="${{ steps.resolve-version.outputs.branch }}"
        DEPTH="${{ steps.resolve-version.outputs.depth }}"

        # Re-clone if the SDK is missing, incomplete, or a different version was
        # restored from cache via a prefix restore-key.
        CACHED_VERSION=$(cat "$FLUTTER_PATH/version" 2>/dev/null || echo "")
        if [ ! -f "$FLUTTER_PATH/bin/flutter" ] || [ "$CACHED_VERSION" != "$BRANCH" ]; then
          echo "Flutter SDK missing or version mismatch (cached=$CACHED_VERSION want=$BRANCH) — cloning"
          rm -rf "$FLUTTER_PATH"
          git clone --depth "$DEPTH" \
            --branch "$BRANCH" \
            https://github.com/flutter/flutter.git \
            "$FLUTTER_PATH"
        fi

    - name: Set environment
      shell: bash
      run: |
        FLUTTER_PATH="${{ steps.get-path.outputs.flutter-path }}"
        echo "FLUTTER_ROOT=$FLUTTER_PATH" >> $GITHUB_ENV
        echo "FLUTTER_HOME=$FLUTTER_PATH" >> $GITHUB_ENV
        echo "$FLUTTER_PATH/bin" >> $GITHUB_PATH
        echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> $GITHUB_ENV

    - name: Verify Flutter SDK
      shell: bash
      run: |
        FLUTTER_PATH="${{ steps.get-path.outputs.flutter-path }}"

        # Must have the Flutter tool entry-point.
        if [ ! -f "$FLUTTER_PATH/bin/flutter" ]; then
          echo "ERROR: Flutter SDK is still incomplete after setup."
          echo "Contents of $FLUTTER_PATH:"
          ls -la "$FLUTTER_PATH" 2>/dev/null || echo "(directory empty or missing)"
          exit 1
        fi

        # Print version from whatever source is available.
        FLUTTER_VERSION=$(
          cat "$FLUTTER_PATH/version" 2>/dev/null ||
          git -C "$FLUTTER_PATH" describe --tags --abbrev=0 2>/dev/null ||
          echo "unknown"
        )
        echo "Flutter version: $FLUTTER_VERSION"
        echo "Engine: $(cat "$FLUTTER_PATH/bin/internal/engine.version" 2>/dev/null || echo 'not found')"
