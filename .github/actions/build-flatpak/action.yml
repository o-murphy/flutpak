name: Build Flatpak
description: >
  Installs org.flatpak.Builder, lints the manifest, builds the Flatpak,
  lints the resulting repo, and exports a .flatpak bundle.

inputs:
  manifest:
    description: "Path to the generated Flatpak manifest (.yml)"
    required: true
  app-id:
    description: "Flatpak application ID (e.g. io.github.example.App)"
    required: true
  arch:
    description: >
      Target architecture (x86_64 or aarch64).
      Auto-detected from 'flatpak --default-arch' if not set.
    required: false
    default: ""
  bundle:
    description: >
      Output .flatpak bundle filename.
      Defaults to '<app-id>_<arch>.flatpak'.
    required: false
    default: ""
  artifact-name:
    description: "Upload the bundle as this artifact name. Skip upload if empty."
    required: false
    default: ""
  runtime:
    description: "Export as a runtime/extension bundle (passes --runtime to flatpak build-bundle)"
    required: false
    default: ""
  retention-days:
    description: "Artifact retention in days"
    required: false
    default: "2"
  github-token:
    description: "GitHub token for private source downloads via ~/.netrc"
    required: false
    default: ""

outputs:
  bundle:
    description: "Path to the exported .flatpak bundle"
    value: ${{ steps.meta.outputs.bundle }}
  arch:
    description: "Architecture used for the build"
    value: ${{ steps.meta.outputs.arch }}
  artifact-url:
    description: "URL of the uploaded artifact"
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Resolve arch and bundle name
      id: meta
      shell: bash
      env:
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_BUNDLE: ${{ inputs.bundle }}
        INPUT_APP_ID: ${{ inputs.app-id }}
      run: |
        ARCH="$INPUT_ARCH"
        [ -z "$ARCH" ] && ARCH="$(flatpak --default-arch 2>/dev/null || echo x86_64)"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

        BUNDLE="$INPUT_BUNDLE"
        [ -z "$BUNDLE" ] && BUNDLE="${INPUT_APP_ID}_${ARCH}.flatpak"
        echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

    - name: Install org.flatpak.Builder
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        install_flatpak_builder

    - name: Lint manifest
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        lint_flatpak_manifest "$INPUT_MANIFEST"

    - name: Configure GitHub token
      if: inputs.github-token != ''
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "machine github.com login x-access-token password ${INPUT_GITHUB_TOKEN}" >> ~/.netrc
        chmod 600 ~/.netrc

    - name: Build Flatpak
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        build_flatpak "$INPUT_MANIFEST"

    - name: Lint repo
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        lint_flatpak_repo repo

    - name: Export bundle
      shell: bash
      env:
        META_ARCH: ${{ steps.meta.outputs.arch }}
        META_BUNDLE: ${{ steps.meta.outputs.bundle }}
        INPUT_APP_ID: ${{ inputs.app-id }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        export_flatpak_bundle "$META_ARCH" repo "$META_BUNDLE" "$INPUT_APP_ID" "$INPUT_RUNTIME"

    - name: Upload bundle artifact
      id: upload
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.meta.outputs.bundle }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
