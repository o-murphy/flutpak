name: Build Flatpak
description: >
  Builds a Flatpak and optionally exports a .flatpak bundle.
  Two modes are available via use-flathub-builder:
    false (default) — delegates to flatpak/flatpak-github-actions/flatpak-builder.
    true             — runs lint + flathub-build + lint using native binaries from
                       the ghcr.io/flathub-infra/flatpak-github-actions container
                       (requires container: at the job level). Validates Flathub
                       compatibility via flathub-build.

inputs:
  manifest:
    description: "Path to the generated Flatpak manifest (.yml)"
    required: true
  app-id:
    description: "Flatpak application ID (e.g. io.github.example.App)"
    required: true
  arch:
    description: >
      Target architecture (x86_64 or aarch64).
      Auto-detected from 'flatpak --default-arch' if not set.
    required: false
    default: ""
  bundle:
    description: >
      Output .flatpak bundle filename.
      Defaults to '<app-id>_<arch>.flatpak'.
    required: false
    default: ""
  artifact-name:
    description: "Upload the bundle as this artifact name. Skip upload if empty."
    required: false
    default: ""
  retention-days:
    description: "Artifact retention in days"
    required: false
    default: "2"
  use-flathub-builder:
    description: >
      false (default): delegate to flatpak/flatpak-github-actions/flatpak-builder@v6.
      true: use native flathub-build + flatpak-builder-lint from the
      ghcr.io/flathub-infra/flatpak-github-actions container for Flathub
      compatibility validation. Requires the job to set:
        container:
          image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-*
          options: --privileged
    required: false
    default: "false"
  github-token:
    description: "GitHub token for private source downloads via ~/.netrc"
    required: false
    default: ""

outputs:
  bundle:
    description: "Path to the exported .flatpak bundle"
    value: ${{ steps.meta.outputs.bundle }}
  arch:
    description: "Architecture used for the build"
    value: ${{ steps.meta.outputs.arch }}
  artifact-url:
    description: "URL of the uploaded artifact (use-flathub-builder: true only)"
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Resolve arch and bundle name
      id: meta
      shell: bash
      env:
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_BUNDLE: ${{ inputs.bundle }}
        INPUT_APP_ID: ${{ inputs.app-id }}
      run: |
        ARCH="$INPUT_ARCH"
        [ -z "$ARCH" ] && ARCH="$(flatpak --default-arch 2>/dev/null || echo x86_64)"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

        BUNDLE="$INPUT_BUNDLE"
        [ -z "$BUNDLE" ] && BUNDLE="${INPUT_APP_ID}_${ARCH}.flatpak"
        echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

    - name: Configure GitHub token
      if: inputs.github-token != ''
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "machine github.com login x-access-token password ${INPUT_GITHUB_TOKEN}" >> ~/.netrc
        chmod 600 ~/.netrc

    # ── use-flathub-builder: false — delegate to flatpak-github-actions ──────

    - name: Build Flatpak
      if: inputs.use-flathub-builder != 'true'
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        manifest-path: ${{ inputs.manifest }}
        bundle: ${{ steps.meta.outputs.bundle }}
        arch: ${{ steps.meta.outputs.arch }}
        upload-artifact: ${{ inputs.artifact-name != '' }}
        cache-key: flatpak-builder-${{ steps.meta.outputs.arch }}-${{ github.sha }}

    # ── use-flathub-builder: true — container mode with flathub-build ────────

    - name: Lint manifest
      if: inputs.use-flathub-builder == 'true'
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        lint_flatpak_manifest "$INPUT_MANIFEST"

    - name: Build Flatpak
      if: inputs.use-flathub-builder == 'true'
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        build_flatpak "$INPUT_MANIFEST"

    - name: Lint repo
      if: inputs.use-flathub-builder == 'true'
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        lint_flatpak_repo repo

    - name: Export bundle
      if: inputs.use-flathub-builder == 'true'
      shell: bash
      env:
        META_ARCH: ${{ steps.meta.outputs.arch }}
        META_BUNDLE: ${{ steps.meta.outputs.bundle }}
        INPUT_APP_ID: ${{ inputs.app-id }}
      run: |
        source "$GITHUB_ACTION_PATH/../../../scripts/flatpak-build.sh"
        export_flatpak_bundle "$META_ARCH" repo "$META_BUNDLE" "$INPUT_APP_ID"

    - name: Upload bundle artifact
      id: upload
      if: ${{ inputs.use-flathub-builder == 'true' && inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.meta.outputs.bundle }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
