name: Verify Flatpak Manifest
description: >
  Verifies that the committed Flatpak manifest is correctly pinned.
  Uses flutpak verify — parses YAML properly so dependency module tags
  (e.g. bclibc) are never mistaken for the app module's tag.

inputs:
  tag_name:
    description: >
      Expected release tag (e.g. v0.1.15). If empty, only checks that no
      __FLATPAK_* placeholder remains and tag/commit are non-empty.
    required: false
    default: ''
  commit:
    description: >
      Expected commit SHA. If empty, only checks that no placeholder remains.
    required: false
    default: ''
  manifest:
    description: >
      Path to the Flatpak manifest YAML file.
      If omitted, auto-detected from flutpak config output dir.
    required: false
    default: ''
  flutpak_ref:
    description: >
      Git ref (tag, branch, or SHA) to run flutpak from.
      If empty, uses the HEAD of the default branch.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Clone flutpak
      shell: bash
      run: |
        git clone https://github.com/o-murphy/flutpak.git "$RUNNER_TEMP/flutpak-src"
        REF="${{ inputs.flutpak_ref }}"
        if [ -n "$REF" ]; then
          git -C "$RUNNER_TEMP/flutpak-src" fetch --tags
          git -C "$RUNNER_TEMP/flutpak-src" checkout "$REF"
        fi
        dart pub get --directory="$RUNNER_TEMP/flutpak-src"

    - name: Verify manifest pins
      shell: bash
      run: |
        ARGS=()
        [ -n "${{ inputs.manifest }}" ] && ARGS+=(--manifest "${{ inputs.manifest }}")
        [ -n "${{ inputs.tag_name }}" ] && ARGS+=(--tag "${{ inputs.tag_name }}")
        [ -n "${{ inputs.commit }}" ]   && ARGS+=(--commit "${{ inputs.commit }}")
        dart run "$RUNNER_TEMP/flutpak-src/bin/flutpak.dart" verify "${ARGS[@]}"
